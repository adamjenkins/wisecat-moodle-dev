name: wisecat-moodle-dev
version: 0.1.0
schema: v1
rules:
  - uses: ./rules/moodle-5-3-changes.md
  - uses: ./rules/moodle-accessibility.md
  - uses: ./rules/moodle-amd-javascript.md
  - uses: ./rules/moodle-behat-testing.md
  - uses: ./rules/moodle-ci-matrix.md
  - uses: ./rules/moodle-definition-of-done.md
  - uses: ./rules/moodle-field-lessons.md
  - uses: ./rules/moodle-hooks-api.md
  - uses: ./rules/moodle-language-pack.md
  - uses: ./rules/moodle-marketplace-package.md
  - uses: ./rules/moodle-mobile-app.md
  - uses: ./rules/moodle-performance.md
  - uses: ./rules/moodle-phpunit-testing.md
  - uses: ./rules/moodle-plugin-development.md
  - uses: ./rules/moodle-plugin-release.md
  - uses: ./rules/moodle-privacy-gdpr.md
  - uses: ./rules/moodle-release-preflight.md
  - uses: ./rules/moodle-security-audit.md
  - uses: ./rules/moodle-theme-boost-child.md
  - uses: ./rules/moodle-theme-development.md
  - uses: ./rules/moodle-theme-layouts-templates.md
  - uses: ./rules/moodle-theme-renderers-output.md
  - uses: ./rules/moodle-theme-scss.md
  - uses: ./rules/moodle-theme-settings.md
  - uses: ./rules/moodle-theme-testing-release.md
  - uses: ./rules/moodle-upgrade-migration.md
  - uses: ./rules/moodle-walkthrough.md
  - uses: ./rules/moodle-web-services.md
prompts:
  - name: add-language-pack
    description: Translate a Moodle plugin's strings into one language and save the pack in the project's notes directory, not the plugin.
    prompt: ./prompts/add-language-pack.md
  - name: moodle-bump-version
    description: Bump $plugin->version in version.php and add an upgrade.php step for a Moodle plugin.
    prompt: ./prompts/moodle-bump-version.md
  - name: moodle-capability-audit
    description: Audit a plugin's capabilities — verifies db/access.php declarations match runtime require_capability/has_capability calls, checks risk bitmasks, default archetypes, and lang strings.
    prompt: ./prompts/moodle-capability-audit.md
  - name: moodle-codestyle
    description: Run phpcs with the Moodle coding standard and fix reported issues.
    prompt: ./prompts/moodle-codestyle.md
  - name: moodle-mustache-lint
    description: Lint Mustache templates for accessibility, security, hard-coded strings, Moodle template conventions and, in a theme, template overrides.
    prompt: ./prompts/moodle-mustache-lint.md
  - name: moodle-new-plugin
    description: Scaffold a new Moodle plugin for Moodle 5.2 and 5.3 (asks for type + name).
    prompt: ./prompts/moodle-new-plugin.md
  - name: moodle-new-theme
    description: Scaffold a Boost child theme for Moodle 5.2 and 5.3 (asks for the name and what it must change).
    prompt: ./prompts/moodle-new-theme.md
  - name: moodle-privacy-audit
    description: Audit a Moodle plugin's privacy provider for completeness against its DB schema, preferences, files and external services.
    prompt: ./prompts/moodle-privacy-audit.md
  - name: moodle-security-review
    description: Run the Moodle security checklist on a file, directory, or entire plugin.
    prompt: ./prompts/moodle-security-review.md
  - name: moodle-string-check
    description: Find hard-coded English strings that should use get_string() / Mustache {{#str}}.
    prompt: ./prompts/moodle-string-check.md
  - name: moodle-theme-check
    description: Static check of a Moodle theme directory against the theme skills' common mistakes; reports file:line for each finding and states what was not checked.
    prompt: ./prompts/moodle-theme-check.md
